<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact Us – Roast Not Found</title>
    <!-- Custom Font Link -->
    <link rel="stylesheet" href="fonts/style.css">
    <link href="https://db.onlinewebfonts.com/c/031da03967812d134ed68febd3ba78a9?family=GT+America+Regular"
        rel="stylesheet">
    
    <link href="http://www.jqueryscript.net/css/jquerysctipttop.css" rel="stylesheet" type="text/css">
    <link href="css/nivo-lightbox_new.css" rel="stylesheet" type="text/css">
    <link href="css/nivo_themes/default/default.css" rel="stylesheet" type="text/css">

    <!-- Bootstrap Minified CSS Link -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    
    <!-- Bootstrap Minified JS Link -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom CSS Link -->
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- Font Awesome CDN Link -->
    <script src="https://kit.fontawesome.com/71a4119613.js" crossorigin="anonymous"></script>
    <link href="/fontawesome/css/fontawesome.min.css" rel="stylesheet">
    <link href="/fontawesome/css/brands.min.css" rel="stylesheet">
    <link href="/fontawesome/css/solid.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #320A6B, #065084, #0F828C);
            color: #23293c;
            font-family: 'Acorn', sans-serif;
            margin: 0;
            min-height: 100vh;
            font-size: 1.1em;
            letter-spacing: 0.01em;
            line-height: 1.7;
            box-sizing: border-box;
            padding: 0;
            scroll-behavior: smooth;
        }

        .wave-animation {
            background: linear-gradient(135deg,
                    #320A6B 0%,
                    #065084 25%,
                    #054b52 50%,
                    #320A6B 75%,
                    #065084 100%);
            background-size: 300% 100%;
            animation: gradient-move 6s ease-in-out infinite alternate;
        }

        @keyframes gradient-move {
            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 100% 50%;
            }
        }

        .container-wide {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 2.2rem 3rem 2.2rem;
        }

        header {
            text-align: center;
            margin-top: 2.8rem;
            margin-bottom: 2.3rem;
        }

        header h1 {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -2px;
            color: #fff;
            margin-bottom: 0.32em;
            line-height: 1.06;
            font-family: 'Acorn', 'Arial Rounded MT Bold', sans-serif;
            text-shadow: 0 6px 32px #181c3b44;
        }

        .contact-card {
            border-radius: 16px;
            background: #fff;
            color: #273057;
            box-shadow: 0 8px 36px rgba(61, 28, 102, 0.07), 0 1px 1px #6750be22;
            padding: 2.2rem 2.4rem 2rem 2.4rem;
            position: relative;
            overflow: visible;
            min-width: 0;
            margin-bottom: 3.5rem;
            border-left: 7px solid #65a2f6;
            border-bottom: 1px solid #e3eaf5;
        }

        .contact-card h2 {
            font-size: 1.21em;
            font-weight: 700;
            color: #22537e;
            margin-bottom: 0.93em;
            letter-spacing: 0.01em;
            margin-top: 0.4em;
        }

        .contactform-group {
            margin-bottom: 1.3em;
        }

        .contactform-label {
            display: block;
            margin-bottom: 0.35em;
            color: #3c4473;
            font-weight: 500;
        }

        .contactform-input,
        .contactform-textarea {
            font-family: inherit;
            font-size: 1em;
            padding: 0.7em 1.1em;
            width: 100%;
            border: 1.2px solid #d3d9ec;
            border-radius: 7px;
            outline: none;
            margin-bottom: 0.1em;
            background: #f6faff;
            color: #241a39;
            transition: border-color .22s, box-shadow .18s;
            box-sizing: border-box;
        }

        .contactform-input:focus,
        .contactform-textarea:focus {
            border-color: #4fb5da;
            box-shadow: 0 2px 12px #59d6fb23;
            background: #f2f7fe;
        }

        .contactform-textarea {
            resize: vertical;
            min-height: 100px;
            max-height: 250px;
            font-size: 1em;
        }

        .contactform-submit {
            background: linear-gradient(90deg, #4fb5da 60%, #ffb34f 100%);
            border: none;
            color: #fff;
            font-weight: 700;
            font-size: 1.07em;
            padding: 0.75em 2.4em;
            border-radius: 10px;
            box-shadow: 0 2px 12px #56d6fb32;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.18s;
        }

        .contactform-submit:hover,
        .contactform-submit:focus {
            background: linear-gradient(90deg, #ffb34f 30%, #4fb5da 100%);
            box-shadow: 0 5px 24px #4fb5da55;
        }

        .thanks-message {
            background: #eaf9f8;
            color: #17647f;
            border-left: 4px solid #4fb5da;
            border-radius: 8px;
            margin-top: 2em;
            padding: 1.1em 1.5em;
            font-size: 1.05em;
            display: none;
        }

        /* Floating Chatbot Icon */
        .chatbot-float {
            position: fixed;
            bottom: 32px;
            right: 28px;
            z-index: 100;
            background: linear-gradient(135deg, #157bff 30%, #ebcbff 100%);
            color: #fff;
            width: 67px;
            height: 67px;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 6px 22px #153c8c65;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.6em;
            cursor: pointer;
            transition: box-shadow 0.25s, transform 0.18s;
            animation: bounceIn 1.4s;
        }

        .chatbot-float:hover {
            box-shadow: 0 6px 32px #8f67ff77;
            transform: scale(1.06);
        }

        @keyframes bounceIn {
            0% {
                transform: translateY(100px);
                opacity: 0;
            }

            60% {
                transform: translateY(-20px);
                opacity: 0.9;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Chatbot Window */
        .chatbot-modal {
            position: fixed;
            bottom: 120px;
            right: 38px;
            width: 360px;
            max-width: 92vw;
            background: #fff;
            border-radius: 13px 13px 10px 24px;
            box-shadow: 0 7px 36px #59268525;
            z-index: 110;
            overflow: hidden;
            border: 2px solid #157bff44;
            display: none;
            flex-direction: column;
            animation: popIn 0.48s;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.83);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .chatbot-header {
            background: linear-gradient(90deg, #157bff 70%, #ffb34f 120%);
            color: #fff;
            padding: 1em 1.2em;
            font-size: 1.08em;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chatbot-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.2em;
            line-height: 1;
            cursor: pointer;
            padding: 0 0.15em;
            opacity: 0.7;
            transition: opacity 0.16s;
        }

        .chatbot-close:hover {
            opacity: 1;
        }

        .chatbot-body {
            padding: 1.12em 1.14em 1em 1.16em;
            min-height: 110px;
            max-height: 280px;
            overflow-y: auto;
            background: #f7faff;
            color: #23293c;
            font-size: 1.01em;
            border-bottom: 1px solid #dae1ef77;
        }

        .chatbot-question {
            display: block;
            width: 100%;
            background: #eaf4fa;
            color: #09536d;
            font-size: 1em;
            border: 1px solid #b7e1ff;
            border-radius: 8px;
            margin: 0.44em 0 0.9em 0;
            padding: 0.5em 1.14em;
            text-align: left;
            cursor: pointer;
            transition: background .14s, border .22s;
            font-family: inherit;
        }

        .chatbot-question:hover,
        .chatbot-question.selected {
            background: #157bff1a;
            border-color: #4fb5da;
        }

        .chatbot-answer {
            background: #fffbe9;
            color: #be8314;
            border-left: 4px solid #ffb34f;
            border-radius: 6px;
            margin: 0.62em 0;
            padding: 0.8em 1.2em;
            font-style: italic;
            font-size: 1.01em;
            box-shadow: 0 1px 14px #ffe6ba2c;
            animation: fadeInAnswer 0.29s;
            display: none;
        }

        @keyframes fadeInAnswer {
            from {
                opacity: 0;
                transform: scale(0.97);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Responsive adjustments */
        @media (max-width: 900px) {
            .container-wide {
                padding: 0 1.1rem 2.4rem 1.1rem;
            }

            .contact-card {
                padding: 1.15rem 0.85rem 1.15rem 1rem;
            }

            header {
                margin-top: 1.2rem;
            }

            .chatbot-modal {
                right: 8px;
                width: 98vw;
            }
        }

        @media (max-width: 600px) {
            .container-wide {
                padding-left: 0.2rem;
                padding-right: 0.2rem;
            }

            .profile-card,
            .highlight-section {
                border-radius: 10px;
            }

            header h1 {
                font-size: 1.5em;
            }

            .chatbot-modal {
                width: 98vw;
            }
        }
    </style>
</head>

<body class="wave-animation">

    <!-- Header Section -->
    <nav class="navbar navbar-expand-lg padding-container">
        <!--Navbar brand-->
        <a style="padding: 5px;" href="/" class="navbar-brand"><img src="images/Group-icon.png" height="50px" alt=""></a>
    
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <!--Nav-links-->
            <div class="navbar-nav ms-auto text-center">
                <div class="nav-item fs-4">
                    <a href="story.html" class="nav-link">OUR STORY<i class="fa-brands fa-earlybirds"></i></a>
                </div>
    
                <div class="nav-item fs-4">
                    <a href="contactus.html" class="nav-link">CONTACT US<i class="fa-solid fa-cubes"></i></a>
                </div>
    
                <div class="nav-item fs-4">
                    <a href="/" class="nav-link">HOME<i class="fa-solid fa-house"></i></a>
                </div>
            </div>
        </div>
    </nav>





    <div class="container-wide">
        <header>
            <h1>Contact Us</h1>
            <div class="hero-tagline">Have a question? Reach out or ask our Roast Not Found Chatbot!</div>
        </header>
        <section class="contact-card">
            <h2>Send a Message</h2>
            <form id="contactForm" autocomplete="off">
                <div class="contactform-group">
                    <label class="contactform-label" for="name">Your Name</label>
                    <input class="contactform-input" type="text" id="name" name="name" required
                        placeholder="Enter your name" />
                </div>
                <div class="contactform-group">
                    <label class="contactform-label" for="email">Your Email</label>
                    <input class="contactform-input" type="email" id="email" name="email" required
                        placeholder="you@email.com" />
                </div>
                <div class="contactform-group">
                    <label class="contactform-label" for="message">Message</label>
                    <textarea class="contactform-textarea" id="message" name="message" required
                        placeholder="Type your message here..."></textarea>
                </div>
                <button type="submit" class="contactform-submit">Send</button>
            </form>
            <div class="thanks-message" id="thanksMessage">Thank you! We'll get back to you soon.</div>
        </section>
    </div>
    <!-- Floating Chatbot Button -->
    <div class="chatbot-float" id="chatbotToggle" title="Chat with Roast Not Found Bot" aria-label="Open chatbot">🤖
    </div>

    <!-- Chatbot Modal -->
    <div class="chatbot-modal" id="chatbotModal" role="dialog" aria-modal="true" aria-labelledby="chatbotTitle">
        <div class="chatbot-header">
            <span id="chatbotTitle">Roast Not Found Chatbot</span>
            <button class="chatbot-close" id="chatbotClose" title="Close">&#10005;</button>
        </div>
        <div class="chatbot-body" id="chatbotBody">
            <div style="margin-bottom:.9em; color: #076979f0;">
                Ask me something:
            </div>
            <button class="chatbot-question"
                data-answer="I'm an AI bot with a sense of humor! Need a tech roast or meme suggestion? Ask away!">
                What is Roast Not Found?
            </button>
            <button class="chatbot-question"
                data-answer="To join our team, bring your best code and your sharpest wit! Drop us a message in the contact form.">
                How can I join the team?
            </button>
            <button class="chatbot-question"
                data-answer="Trouble on the site? Try clearing the cache, then send us a message—we (almost) never bite!">
                I need support with the website.
            </button>
            <button class="chatbot-question"
                data-answer="Our mascot is legendary at roast battles (and dad jokes).">Who's the Roast Not Found
                mascot?</button>
            <button class="chatbot-question"
                data-answer="The secret formula? Teamwork, humor, and a lot of caffeine.">What's the project's
                secret?</button>
        </div>
        <div class="chatbot-answer" id="chatbotAnswer"></div>
    </div>
    <script>
        // Contact form fake submit
        document.getElementById('contactForm').addEventListener('submit', function (e) {
            e.preventDefault();
            document.getElementById('thanksMessage').style.display = 'block';
            this.style.display = 'none';
        });
        // Chatbot handling
        const chatbotToggle = document.getElementById('chatbotToggle');
        const chatbotModal = document.getElementById('chatbotModal');
        const chatbotClose = document.getElementById('chatbotClose');
        const chatbotAnswer = document.getElementById('chatbotAnswer');
        document.body.addEventListener('click', function (e) {
            // If floating bot clicked show modal
            if (e.target === chatbotToggle) {
                chatbotModal.style.display = 'flex';
                chatbotAnswer.style.display = 'none';
                chatbotAnswer.textContent = '';
            }
            // If close clicked
            if (e.target === chatbotClose) {
                chatbotModal.style.display = 'none';
                chatbotAnswer.style.display = 'none';
            }
            // For outside modal click
            if (!chatbotModal.contains(e.target) && e.target !== chatbotToggle && chatbotModal.style.display === 'flex') {
                if (!e.target.classList || !e.target.classList.contains('chatbot-question')) chatbotModal.style.display = 'none';
            }
        });
        // Chatbot question selection
        Array.from(document.querySelectorAll('.chatbot-question')).forEach(function (btn) {
            btn.addEventListener('click', function () {
                chatbotAnswer.textContent = btn.getAttribute('data-answer');
                chatbotAnswer.style.display = 'block';
                Array.from(document.querySelectorAll('.chatbot-question')).forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
            });
        });
        // Keyboard accessibility
        chatbotToggle.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { chatbotModal.style.display = 'flex'; }
        });
        chatbotClose.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { chatbotModal.style.display = 'none'; }
        });
    </script>
</body>

</html>
